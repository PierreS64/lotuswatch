[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "lotuswatch-security"
version = "0.1.0-alpha.6"
description = "Open-source website security monitoring and configuration checker"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "PierreS64" }
]
keywords = [
    "security",
    "monitoring",
    "tls",
    "http",
    "dns",
    "cli"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: System :: Monitoring"
]
dependencies = [
    "dnspython>=2.8,<3.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.8,<3.0",
    "rich>=13.7,<15.0",
    "typer>=0.12,<1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0"
]

[project.scripts]
lotuswatch = "lotuswatch.cli:app"

[project.urls]
Homepage = "https://github.com/PierreS64/lotuswatch"
Documentation = "https://github.com/PierreS64/lotuswatch#readme"
Repository = "https://github.com/PierreS64/lotuswatch.git"
Issues = "https://github.com/PierreS64/lotuswatch/issues"
Changelog = "https://github.com/PierreS64/lotuswatch/releases"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lotuswatch*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
