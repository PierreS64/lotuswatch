[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lotuswatch-security"
version = "0.1.0-alpha.4"
description = "Open-source website security monitoring and configuration checker"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "PierreS64" }
]
dependencies = [
    "dnspython>=2.8,<3.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.8,<3.0",
    "rich>=13.7,<15.0",
    "typer>=0.12,<1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0"
]

[project.scripts]
lotuswatch = "lotuswatch.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
